<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Space Architects</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    background: #111;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .hero {
    position: relative;
    width: 390px;
    height: 780px;
    overflow: hidden;
    background: #0a0a0a;
  }

  /* Left photo panel */
  .hero::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 45%;
    height: 55%;
    background: Screenshot_2026-08-09-00-15-06-372_com.openai.chatgpt-edit.jpg(160deg, #3a4a5c 0%, #1a2530 40%, #0d1218 100%);
    clip-path: polygon(0 0, 100% 0, 55% 100%, 0 100%);
  }

  /* Right photo panel */
  .hero::after {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 50%;
    height: 60%;
    background: linear-gradient(200deg, #e08a3c 0%, #b85c38 35%, #2a2f3a 70%, #10131a 100%);
    clip-path: polygon(45% 0, 100% 0, 100% 100%, 0 100%);
  }

  .gold-line {
    position: absolute;
    top: 0;
    width: 3px;
    height: 60%;
    background: linear-gradient(180deg, #d4a24c, transparent);
    z-index: 2;
  }
  .gold-line.left { left: 40%; transform: skewX(-12deg); }
  .gold-line.right { right: 36%; transform: skewX(12deg); }

  /* Top bar */
  .topbar {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px 20px 0;
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-mark svg { width: 34px; height: 34px; }
  .logo-text .name {
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .logo-text .sub {
    color: #d4a24c;
    font-size: 8px;
    letter-spacing: 3px;
    margin-top: 2px;
  }

  .menu-icon {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 6px;
  }
  .menu-icon span {
    width: 24px;
    height: 2px;
    background: #d4a24c;
  }

  /* Center content */
  .content {
    position: relative;
    z-index: 5;
    text-align: center;
    margin-top: 130px;
    padding: 0 24px;
  }

  .skyline {
    width: 140px;
    margin: 0 auto 20px;
  }

  .brand h1 {
    color: #fff;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 6px;
    line-height: 1.3;
  }
  .brand h1 span { color: #d4a24c; }

  .brand h2 {
    color: #eee;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 6px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .brand h2::before,
  .brand h2::after {
    content: "";
    width: 24px;
    height: 1px;
    background: #d4a24c;
  }

  .tagline {
    color: #ccc;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 18px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 26px;
    padding: 12px 22px;
    border: 1px solid #d4a24c;
    color: #d4a24c;
    font-size: 11px;
    letter-spacing: 2px;
    text-decoration: none;
    background: transparent;
  }

  /* Side dots */
  .dots {
    position: absolute;
    right: 16px;
    top: 65%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 5;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #444;
  }
  .dots span.active { background: #d4a24c; }

  /* Bottom diagonal gold lines */
  .corner-lines {
    position: absolute;
    left: -10px;
    bottom: -10px;
    z-index: 4;
  }
  .corner-lines span {
    position: absolute;
    width: 160px;
    height: 1px;
    background: #d4a24c;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="hero">

  <div class="gold-line left"></div>
  <div class="gold-line right"></div>

  <div class="topbar">
    <div class="logo-mark">
      <svg viewBox="0 0 60 60" fill="none">
        <path d="M8 55V30L18 20V55" stroke="#d4a24c" stroke-width="2"/>
        <path d="M22 55V15L34 5V55" stroke="#fff" stroke-width="2"/>
        <path d="M38 55V25L50 15V55" stroke="#d4a24c" stroke-width="2"/>
        <line x1="34" y1="5" x2="34" y2="-8" stroke="#fff" stroke-width="2"/>
        <path d="M30 -6L34 -12L38 -6" stroke="#fff" stroke-width="2" fill="none"/>
      </svg>
      <div class="logo-text">
        <div class="name">VISION SPACE</div>
        <div class="sub">ARCHITECTS</div>
      </div>
    </div>
    <div class="menu-icon">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="content">
    <svg class="skyline" viewBox="0 0 200 140" fill="none">
      <path d="M20 140V70L55 45V140" stroke="#d4a24c" stroke-width="3"/>
      <path d="M65 140V35L105 10V140" stroke="#fff" stroke-width="3"/>
      <path d="M115 140V55L155 30V140" stroke="#d4a24c" stroke-width="3"/>
      <line x1="105" y1="10" x2="105" y2="-25" stroke="#fff" stroke-width="3"/>
      <path d="M95 -20L105 -35L115 -20" stroke="#fff" stroke-width="3" fill="none"/>
      <line x1="20" y1="140" x2="55" y2="140" stroke="#d4a24c" stroke-width="2"/>
      <line x1="115" y1="140" x2="155" y2="140" stroke="#d4a24c" stroke-width="2"/>
    </svg>

    <div class="brand">
      <h1>VISION <span>SPACE</span></h1>
      <h2>ARCHITECTS</h2>
    </div>

    <div class="tagline">DESIGNING SPACES, CREATING FUTURES</div>

    <a href="#" class="cta">EXPLORE OUR WORK &rarr;</a>
  </div>

  <div class="dots">
    <span class="active"></span>
    <span class="active"></span>
    <span class="active"></span>
    <span class="active"></span>
    <span></span>
    <span></span>
  </div>

</div>

</body>
</html>
